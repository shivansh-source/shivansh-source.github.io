<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L0,8 L7,4 Z" fill="#8a8f98" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="710" fill="#fafafa" />

  <!-- Eyebrow -->
  <rect x="80" y="40" width="64" height="4" fill="#1f6f4a" />
  <text x="80" y="70" font-family="'Courier New', monospace" font-size="15" letter-spacing="2" fill="#6b7280">THE PROGRESSION</text>

  <!-- Box 1 -->
  <rect x="80" y="100" width="840" height="64" rx="6" fill="#ffffff" stroke="#e2e2e2" stroke-width="1.5" />
  <text x="104" y="139" font-size="27" fill="#1a1a1a">Humans read and understand the code</text>

  <!-- Arrow 1 + annotation -->
  <line x1="100" y1="164" x2="100" y2="206" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="140" y="190" font-family="'Courier New', monospace" font-size="15" fill="#8a8f98">the incentive rewards volume, not understanding</text>

  <!-- Box 2 -->
  <rect x="80" y="214" width="840" height="64" rx="6" fill="#ffffff" stroke="#e2e2e2" stroke-width="1.5" />
  <text x="104" y="253" font-size="27" fill="#1a1a1a">Humans stop reading the code</text>

  <!-- Arrow 2 + annotation -->
  <line x1="100" y1="278" x2="100" y2="320" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="140" y="304" font-family="'Courier New', monospace" font-size="15" fill="#8a8f98">nothing in the loop needs it to be readable</text>

  <!-- Box 3 -->
  <rect x="80" y="328" width="840" height="64" rx="6" fill="#ffffff" stroke="#e2e2e2" stroke-width="1.5" />
  <text x="104" y="367" font-size="27" fill="#1a1a1a">The code becomes unreadable</text>

  <!-- Arrow 3 + annotation -->
  <line x1="100" y1="392" x2="100" y2="434" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="140" y="418" font-family="'Courier New', monospace" font-size="15" fill="#8a8f98">nothing in the loop needs it to be runnable</text>

  <!-- Box 4 -->
  <rect x="80" y="442" width="840" height="64" rx="6" fill="#ffffff" stroke="#e2e2e2" stroke-width="1.5" />
  <text x="104" y="481" font-size="27" fill="#1a1a1a">The code becomes unrunnable</text>

  <!-- Arrow 4 (plain, no annotation) -->
  <line x1="100" y1="506" x2="100" y2="548" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- Closing bar -->
  <rect x="80" y="556" width="840" height="64" rx="4" fill="#1a1a1a" />
  <text x="104" y="595" font-size="24" fill="#ffffff">Only the automated loop can run it. And it isn't checking.</text>
  <circle cx="890" cy="588" r="7" fill="#3fae74" />
</svg>
