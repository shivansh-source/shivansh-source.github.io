<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 220" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="1500" height="220" fill="#fafafa" />

  <!-- Box 1 -->
  <rect x="60" y="20" width="280" height="130" rx="8" fill="#ffffff" stroke="#e2e2e2" stroke-width="1.5" />
  <text x="200" y="75" font-size="23" font-weight="bold" fill="#1a1a1a" text-anchor="middle">
    <tspan x="200" dy="0">Humans read and</tspan>
    <tspan x="200" dy="30">understand the code</tspan>
  </text>

  <line x1="340" y1="85" x2="420" y2="85" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow2)" />
  <text x="385" y="182" font-family="'Courier New', monospace" font-size="14" fill="#6b7280" text-anchor="middle">the incentive rewards</text>
  <text x="385" y="200" font-family="'Courier New', monospace" font-size="14" fill="#6b7280" text-anchor="middle">volume, not understanding</text>

  <!-- Box 2 -->
  <rect x="430" y="20" width="280" height="130" rx="8" fill="#ffffff" stroke="#e2e2e2" stroke-width="1.5" />
  <text x="570" y="90" font-size="23" font-weight="bold" fill="#1a1a1a" text-anchor="middle">
    <tspan x="570" dy="0">Humans stop reading</tspan>
    <tspan x="570" dy="30">the code</tspan>
  </text>

  <line x1="710" y1="85" x2="790" y2="85" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow2)" />
  <text x="755" y="182" font-family="'Courier New', monospace" font-size="14" fill="#6b7280" text-anchor="middle">nothing in the loop</text>
  <text x="755" y="200" font-family="'Courier New', monospace" font-size="14" fill="#6b7280" text-anchor="middle">needs it to be readable</text>

  <!-- Box 3 -->
  <rect x="800" y="20" width="280" height="130" rx="8" fill="#ffffff" stroke="#e2e2e2" stroke-width="1.5" />
  <text x="940" y="90" font-size="23" font-weight="bold" fill="#1a1a1a" text-anchor="middle">
    <tspan x="940" dy="0">The code becomes</tspan>
    <tspan x="940" dy="30">unreadable</tspan>
  </text>

  <line x1="1080" y1="85" x2="1160" y2="85" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow2)" />
  <text x="1125" y="182" font-family="'Courier New', monospace" font-size="14" fill="#6b7280" text-anchor="middle">nothing in the loop</text>
  <text x="1125" y="200" font-family="'Courier New', monospace" font-size="14" fill="#6b7280" text-anchor="middle">needs it to be runnable</text>

  <!-- Box 4 -->
  <rect x="1170" y="20" width="280" height="130" rx="8" fill="#ffffff" stroke="#e2e2e2" stroke-width="1.5" />
  <text x="1310" y="90" font-size="23" font-weight="bold" fill="#1a1a1a" text-anchor="middle">
    <tspan x="1310" dy="0">The code becomes</tspan>
    <tspan x="1310" dy="30">unrunnable</tspan>
  </text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L0,8 L7,4 Z" fill="#8a8f98" />
    </marker>
  </defs>
</svg>
