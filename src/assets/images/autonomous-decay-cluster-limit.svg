<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 260" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="1400" height="260" fill="#fafafa" />

  <text x="482" y="30" font-family="'Courier New', monospace" font-size="17" fill="#6b7280" text-anchor="middle">Laptop limit</text>
  <line x1="482" y1="42" x2="482" y2="210" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="5 6" />

  <!-- Boxes 1-3: fits on a laptop -->
  <g fill="#eaf5f0" stroke="#1f6f4a">
    <rect x="50" y="60" width="130" height="130" rx="8" stroke-width="1.5" />
    <rect x="197" y="60" width="130" height="130" rx="8" stroke-width="1.5" />
    <rect x="344" y="60" width="130" height="130" rx="8" stroke-width="1.5" />
  </g>
  <g font-size="40" font-weight="bold" fill="#1f6f4a" text-anchor="middle">
    <text x="115" y="140">1</text>
    <text x="262" y="140">2</text>
    <text x="409" y="140">3</text>
  </g>

  <!-- Boxes 4-5: transitional -->
  <g fill="#faf3e0" stroke="#8a6423">
    <rect x="491" y="60" width="130" height="130" rx="8" stroke-width="1.5" />
    <rect x="638" y="60" width="130" height="130" rx="8" stroke-width="1.5" />
  </g>
  <g font-size="40" font-weight="bold" fill="#8a6423" text-anchor="middle">
    <text x="556" y="140">4</text>
    <text x="703" y="140">5</text>
  </g>

  <!-- Boxes 6-9: over the laptop limit -->
  <g fill="#fbeae6" stroke="#a8452c">
    <rect x="785" y="60" width="130" height="130" rx="8" stroke-width="1.5" />
    <rect x="932" y="60" width="130" height="130" rx="8" stroke-width="1.5" />
    <rect x="1079" y="60" width="130" height="130" rx="8" stroke-width="1.5" />
    <rect x="1226" y="60" width="130" height="130" rx="8" stroke-width="1.5" />
  </g>
  <g font-size="40" font-weight="bold" fill="#a8452c" text-anchor="middle">
    <text x="850" y="140">6</text>
    <text x="997" y="140">7</text>
    <text x="1144" y="140">8</text>
    <text x="1291" y="140">9</text>
  </g>

  <text x="262" y="235" font-family="'Courier New', monospace" font-size="17" fill="#6b7280" text-anchor="middle">Runs on your laptop</text>
  <text x="923" y="235" font-family="'Courier New', monospace" font-size="17" fill="#6b7280" text-anchor="middle">Multi-cluster tests need all of these at once</text>
</svg>
